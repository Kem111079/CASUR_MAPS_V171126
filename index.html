<!doctype html>
<html lang="es" data-tema="campo">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#002f5f" />
  <meta name="description" content="CASUR Maps · Mapa de lotes cañeros para trabajo de campo." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="CASUR Maps" />
  <title>CASUR Maps</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
  <link rel="stylesheet" href="./vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body data-tab="mapa">
  <div id="loader" class="loader"><img src="./assets/logo_casur.png" alt="CASUR" /><b>CASUR Maps</b><p id="loaderText">Abriendo…</p></div>

  <main id="vistaMapa">
    <div id="map"></div>
    <div id="arriba">
      <div id="buscador">
        <span class="lupa" aria-hidden="true">🔍</span>
        <input id="q" type="search" placeholder="Buscar lote o productor" autocomplete="off" autocapitalize="characters" enterkeyhint="search" aria-label="Buscar lote, productor o finca" />
        <button id="btnClearQ" type="button" hidden aria-label="Borrar búsqueda">✕</button>
        <div id="sugerencias" role="listbox"></div>
      </div>
      <button id="btnCapas" type="button" class="cuadro" aria-label="Capas y herramientas">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3 2 8.5 12 14l10-5.5L12 3Z"/><path d="m2 13 10 5.5L22 13"/></svg>
      </button>
    </div>
    <div id="chips"><button id="chipGps" type="button" class="chip-gps" hidden></button><span id="chipRed" class="chip-red" hidden>Sin señal · mapa guardado</span></div>
    <div id="leyenda" class="leyenda oculta"></div>
    <button id="btnGps" type="button" class="fab apagado" aria-label="Activar GPS">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4"/></svg>
    </button>
    <div id="medirBar" class="medir" hidden><span id="medirTxt"></span><button id="medirDeshacer" type="button" class="btn ter">↶ Deshacer</button><button id="medirFin" type="button" class="btn pri">Terminar</button></div>
    <section id="card" class="card oculta" aria-live="polite"></section>
  </main>

  <section id="tabVisita" class="tab"></section>
  <section id="tabBitacora" class="tab"></section>
  <section id="tabMas" class="tab"></section>

  <div id="hojaFondo" class="hoja-fondo"></div>
  <section id="hoja" class="hoja" role="dialog" aria-modal="true">
    <div class="hoja-cab"><h3 id="hojaTitulo"></h3><button id="hojaX" type="button" aria-label="Cerrar">✕</button></div>
    <div id="hojaBody" class="hoja-body"></div>
  </section>

  <nav id="nav" aria-label="Secciones">
    <button type="button" data-tab="mapa" class="activo"><svg viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Zm0 0v14m6-12v14"/></svg><span>Mapa</span></button>
    <button type="button" data-tab="visita"><svg viewBox="0 0 24 24"><path d="M5 21V4m0 1h11l-2 4 2 4H5"/></svg><span>Visita</span></button>
    <button type="button" data-tab="bitacora"><svg viewBox="0 0 24 24"><path d="M6 3h12v18H6zM9 8h6M9 12h6M9 16h4"/></svg><span>Bitácora</span></button>
    <button type="button" data-tab="mas"><svg viewBox="0 0 24 24"><path d="M4 20V10m6 10V4m6 16v-7m4 7H2"/></svg><span>Resumen</span></button>
  </nav>
  <div id="toasts" aria-live="polite"></div>

  <script src="./vendor/leaflet/leaflet.js"></script>
  <script src="./js/core.js"></script>
  <script src="./js/map.js"></script>
  <script src="./js/gps.js"></script>
  <script src="./js/field.js"></script>
</body>
</html>
