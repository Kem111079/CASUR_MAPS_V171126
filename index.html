<!doctype html>
<html lang="es" data-tema="campo">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#002f5f" />
  <meta name="description" content="CASUR Maps · Mapa de lotes cañeros para trabajo de campo." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="CASUR Maps" />
  <title>CASUR Maps</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
  <link rel="stylesheet" href="./vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body data-tab="mapa">
  <div id="loader" class="loader"><img src="./assets/logo_casur.png" alt="CASUR" /><b>CASUR Maps</b><p id="loaderText">Abriendo…</p></div>

  <main id="vistaMapa">
    <div id="map"></div>
    <div id="arriba">
      <div id="buscador">
        <svg class="lupa ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.3-4.3"/></svg>
        <input id="q" type="search" placeholder="Buscar lote o finca" autocomplete="off" autocapitalize="characters" enterkeyhint="search" aria-label="Buscar lote o finca (código o nombre)" />
        <button id="btnClearQ" type="button" hidden aria-label="Borrar búsqueda"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        <div id="sugerencias" role="listbox"></div>
      </div>
    </div>
    <div id="chips"><button id="chipGps" type="button" class="chip-gps" hidden></button><button id="chipVisita" type="button" class="chip-visita" hidden onclick="chipVisitaToque()"></button><span id="chipRed" class="chip-red" role="status" hidden>Sin internet</span></div>
    <div id="leyenda" class="leyenda oculta"></div>
    <button id="btnCapas" type="button" class="fab capas" aria-label="Capas y herramientas">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 8.5 12 14l10-5.5L12 3z"/><path d="m2 13 10 5.5L22 13"/></svg>
    </button>
    <button id="btnPanorama" type="button" class="fab panorama" aria-label="Ver alrededores">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/></svg>
    </button>
    <button id="btnBrujula" type="button" class="fab brujula" aria-label="Orientación del mapa">
      <svg viewBox="0 0 24 24" width="30" height="30"><path d="M12 2 8 12h8z" fill="#d7191c"/><path d="M12 22l4-10H8z" fill="currentColor" opacity=".55"/></svg>
    </button>
    <button id="btnGps" type="button" class="fab apagado" aria-label="Activar GPS">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4"/></svg>
    </button>
    <div id="medirBar" class="medir" hidden><span id="medirTxt"></span><button id="medirDeshacer" type="button" class="btn ter"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7 4 12l5 5M4 12h10a5 5 0 0 1 0 10h-2"/></svg> Deshacer</button><button id="medirCompartir" type="button" class="btn sec" hidden aria-label="Compartir la medición"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m8.2 10.8 7.6-4.4M8.2 13.2l7.6 4.4"/></svg> Compartir</button><button id="medirFin" type="button" class="btn pri">Terminar</button></div>
    <span id="atrib">© OpenStreetMap · Esri</span>
    <section id="card" class="card oculta" aria-live="polite"></section>
  </main>

  <section id="tabVisita" class="tab"></section>
  <section id="tabBitacora" class="tab"></section>
  <section id="tabMas" class="tab"></section>
  <section id="tabAjustes" class="tab"></section>

  <div id="hojaFondo" class="hoja-fondo"></div>
  <section id="hoja" class="hoja" role="dialog" aria-modal="true">
    <div class="hoja-cab"><h3 id="hojaTitulo"></h3><button id="hojaX" type="button" aria-label="Cerrar"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div id="hojaBody" class="hoja-body"></div>
  </section>

  <nav id="nav" aria-label="Secciones">
    <button type="button" data-tab="mapa" class="activo"><svg viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Zm0 0v14m6-12v14"/></svg><span>Mapa</span></button>
    <button type="button" data-tab="visita"><svg viewBox="0 0 24 24"><path d="M5 21V4m0 1h11l-2 4 2 4H5"/></svg><span>Visita</span></button>
    <button type="button" data-tab="bitacora"><svg viewBox="0 0 24 24"><path d="M6 3h12v18H6zM9 8h6M9 12h6M9 16h4"/></svg><span>Bitácora</span><em id="insigniaBit" class="insignia" hidden></em></button>
    <button type="button" data-tab="mas"><svg viewBox="0 0 24 24"><path d="M4 20V10m6 10V4m6 16v-7m4 7H2"/></svg><span>Resumen</span></button>
    <button type="button" data-tab="ajustes"><svg viewBox="0 0 24 24"><path d="M18.9 9.9L21.4 10.1L21.4 13.9L18.9 14.1L18.4 15.4L20.0 17.3L17.3 20.0L15.4 18.4L14.1 18.9L13.9 21.4L10.1 21.4L9.9 18.9L8.6 18.4L6.7 20.0L4.0 17.3L5.6 15.4L5.1 14.1L2.6 13.9L2.6 10.1L5.1 9.9L5.6 8.6L4.0 6.7L6.7 4.0L8.6 5.6L9.9 5.1L10.1 2.6L13.9 2.6L14.1 5.1L15.4 5.6L17.3 4.0L20.0 6.7L18.4 8.6Z"/><circle cx="12" cy="12" r="3"/></svg><span>Ajustes</span></button>
  </nav>
  <div id="toasts" aria-live="polite"></div>

  <script src="./vendor/leaflet/leaflet.js"></script>
  <script src="./js/core.js"></script>
  <script src="./js/map.js"></script>
  <script src="./js/gps.js"></script>
  <script src="./js/field.js"></script>
</body>
</html>
