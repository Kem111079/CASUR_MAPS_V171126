# Regenera data/ cuando se sube un shape, un Excel de estimados o un Excel de cortes a fuentes/.
name: Actualizar datos CASUR Maps
on:
  push:
    branches: [main]
    paths: ['fuentes/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install geopandas pyogrio openpyxl
      - name: Shape + estimados
        run: |
          SHAPE=$(ls -t fuentes/*.gpkg fuentes/*.zip fuentes/*.shp 2>/dev/null | head -1 || true)
          EXCEL=$(ls -t fuentes/[Ee]stimados*.xlsx 2>/dev/null | head -1 || true)
          if [ -n "$SHAPE" ] && [ -n "$EXCEL" ]; then
            python tools/actualizar_shape_y_aforo.py "$SHAPE" "$EXCEL" --salida data
          else
            echo "Falta el shape o el Excel de estimados en fuentes/; se omite."
          fi
      - name: Cortes de zafra
        run: |
          CORTES=$(ls -t fuentes/[Cc]ortes*.xlsx fuentes/[Cc]ortes*.csv 2>/dev/null | head -1 || true)
          if [ -n "$CORTES" ]; then python tools/actualizar_cortes.py "$CORTES" --salida data; fi
      - name: Publicar datos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Actualiza datos desde fuentes/" && git push)
