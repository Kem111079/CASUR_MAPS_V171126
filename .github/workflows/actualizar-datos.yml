# Regenera data/ cuando cambia algo en fuentes/.
# Normal: se sube fuentes/Plantilla_CASUR_Maps.xlsx (una fila por lote) y de ahí salen aforo, fechas de corte,
# renovación y cortes reales. También admite los archivos sueltos de antes (Estimados*, Cortes*, *renovacion*).
name: Actualizar datos CASUR Maps
on:
  push:
    branches: [main]
    paths: ['fuentes/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency: actualizar-datos
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install geopandas pyogrio openpyxl
      - name: Procesar fuentes
        run: |
          set -e
          SHAPE=$(ls fuentes/*.gpkg fuentes/*.zip fuentes/*.shp 2>/dev/null | head -1 || true)
          PLANT=$(ls fuentes/[Pp]lantilla*.xlsx 2>/dev/null | head -1 || true)
          if [ -z "$SHAPE" ]; then echo "Falta el shape en fuentes/"; exit 1; fi
          if [ -n "$PLANT" ]; then
            echo "Usando la plantilla única: $PLANT"
            python tools/actualizar_shape_y_aforo.py "$SHAPE" "$PLANT" --salida data
            python tools/actualizar_cortes.py "$PLANT" --salida data
            python tools/actualizar_renovacion.py "$PLANT" --salida data
          else
            EXCEL=$(ls fuentes/[Ee]stimados*.xlsx 2>/dev/null | head -1 || true)
            CORTES=$(ls fuentes/[Cc]ortes*.xlsx fuentes/[Cc]ortes*.csv 2>/dev/null | head -1 || true)
            RENOV=$(ls fuentes/*[Rr]enovacion*.xlsx 2>/dev/null | head -1 || true)
            if [ -n "$EXCEL" ]; then python tools/actualizar_shape_y_aforo.py "$SHAPE" "$EXCEL" --salida data; fi
            if [ -n "$CORTES" ]; then python tools/actualizar_cortes.py "$CORTES" --salida data; fi
            if [ -n "$RENOV" ]; then python tools/actualizar_renovacion.py "$RENOV" --salida data; fi
          fi
      - name: Publicar datos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Actualiza datos desde fuentes/" && git push)
