<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Producción histórica · CASUR Maps</title>
  <style>
    :root{--green:#0b7f3a;--blue:#0b3158;--gold:#f4c542;--muted:#64748b;--border:#dbe5dd;--bg:#f6faf7;--ink:#0f172a}
    *{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
    .top{background:linear-gradient(90deg,var(--green),#005baa 70%,var(--gold));height:7px}main{max-width:1060px;margin:auto;padding:14px}
    .hero{background:linear-gradient(135deg,#07381d,var(--green) 62%,#005baa);color:#fff;border-radius:24px;padding:20px;box-shadow:0 16px 42px rgba(15,23,42,.12)}
    .kicker{font-size:12px;text-transform:uppercase;font-weight:900;letter-spacing:.08em;color:#d9ffe8}.hero h1{margin:6px 0 4px;font-size:30px;line-height:1}.hero p{margin:0;color:rgba(255,255,255,.86);font-weight:700}
    .search{margin-top:12px;background:#fff;border:1px solid var(--border);border-radius:18px;padding:12px;display:flex;gap:8px;align-items:center;box-shadow:0 10px 28px rgba(15,23,42,.05)}
    .search input{flex:1;border:1px solid #cbd5e1;border-radius:14px;padding:12px;font-size:16px;font-weight:800}.search button,.back{border:0;border-radius:14px;padding:12px 14px;font-weight:900;cursor:pointer;background:var(--green);color:#fff;text-decoration:none}.back{display:inline-flex;margin-top:12px;background:#0b3158}
    .card{background:#fff;border:1px solid var(--border);border-radius:22px;margin-top:14px;padding:16px;box-shadow:0 12px 32px rgba(15,23,42,.06)}
    .title h2{margin:0;color:var(--blue);font-size:28px}.title p{margin:4px 0 0;color:var(--muted);font-weight:750}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.summary div{border:1px solid #e2e8f0;border-radius:16px;background:#f8fafc;padding:11px}.summary span{display:block;color:var(--muted);font-size:11px;font-weight:900;text-transform:uppercase}.summary b{display:block;margin-top:5px;color:var(--blue);font-size:22px}.chart{margin-top:14px;border:1px solid #e2e8f0;border-radius:20px;padding:10px;overflow:auto;background:#fff}.chart svg{width:100%;min-width:720px;height:auto;display:block}.table-wrap{margin-top:14px;max-height:360px;overflow:auto;border:1px solid #e2e8f0;border-radius:16px}table{width:100%;border-collapse:collapse;font-size:13px}th{position:sticky;top:0;background:var(--green);color:#fff;text-align:left;padding:10px}td{padding:10px;border-bottom:1px solid #e2e8f0}.empty{background:#fff8df;border:1px solid #f4d35e;border-radius:18px;color:#684500;padding:18px;font-weight:800;margin-top:14px}.note{color:var(--muted);font-size:12px;font-weight:700;margin-top:10px}
    @media(max-width:760px){main{padding:9px}.hero{border-radius:18px;padding:16px}.hero h1{font-size:24px}.search{display:grid}.summary{grid-template-columns:repeat(2,1fr)}.summary b{font-size:18px}.card{border-radius:18px;padding:12px}.title h2{font-size:23px}.chart svg{min-width:620px}}
  </style>
</head>
<body><div class="top"></div><main>
  <section class="hero"><div class="kicker">CASUR Maps · Departamento de Negocios de Caña</div><h1>Producción histórica</h1><p>Vista rápida por CodLote: evolución del TCH y número de corte.</p></section>
  <div class="search"><input id="q" placeholder="Buscar CodLote / HHHSSS" inputmode="text"><button id="searchBtn" type="button">Buscar</button></div>
  <a class="back" href="./index.html">← Volver al mapa</a>
  <section id="out" class="card"><div class="empty">Cargando datos históricos...</div></section>
</main>
<script>
const nf = new Intl.NumberFormat('es-NI',{maximumFractionDigits:2});
function $(id){return document.getElementById(id)}
function esc(v){return String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]))}
function norm(v){return String(v??'').trim().toUpperCase()}
function val(v,s=''){const n=Number(v);return Number.isFinite(n)?nf.format(n)+s:'—'}
let DATA=null;
function paramsCode(){const p=new URLSearchParams(location.search);return p.get('codlote')||p.get('hhhsss')||p.get('cod')||p.get('q')||''}
async function loadData(){if(DATA)return DATA;const r=await fetch('./data/produccion_historica_lote.json',{cache:'no-store'});if(!r.ok)throw new Error('No se pudo cargar data/produccion_historica_lote.json');DATA=await r.json();return DATA}
function chart(rows){
 const data=(rows||[]).filter(r=>Number.isFinite(Number(r.tch))); if(!data.length)return '<div class="empty">Sin datos de TCH para graficar.</div>';
 const W=900,H=360,ml=58,mr=24,mt=28,mb=58; const vals=data.map(r=>Number(r.tch)); let min=Math.min(...vals),max=Math.max(...vals); min=Math.max(0,Math.floor((min-8)/5)*5); max=Math.ceil((max+8)/5)*5; if(max<=min)max=min+10;
 const x=i=>ml+(data.length===1?(W-ml-mr)/2:i*(W-ml-mr)/(data.length-1)); const y=v=>mt+(max-Number(v))*(H-mt-mb)/(max-min);
 const grid=[0,.25,.5,.75,1].map(t=>{const yy=mt+t*(H-mt-mb), vv=max-t*(max-min); return `<line x1="${ml}" y1="${yy}" x2="${W-mr}" y2="${yy}" stroke="#e2e8f0"/><text x="${ml-10}" y="${yy+4}" text-anchor="end" font-size="12" fill="#64748b">${val(vv)}</text>`}).join('');
 const path=data.map((r,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(r.tch).toFixed(1)}`).join(' ');
 const pts=data.map((r,i)=>`<g><circle cx="${x(i).toFixed(1)}" cy="${y(r.tch).toFixed(1)}" r="5" fill="#0b7f3a" stroke="#fff" stroke-width="2"><title>${esc(r.zafra)} · TCH ${val(r.tch)} · Corte ${esc(r.corte??'—')}</title></circle><text x="${x(i).toFixed(1)}" y="${(y(r.tch)-11).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="800" fill="#0b3158">${val(r.tch)}</text><text x="${x(i).toFixed(1)}" y="${H-29}" text-anchor="middle" font-size="12" fill="#334155">${esc(r.zafra)}</text><text x="${x(i).toFixed(1)}" y="${H-10}" text-anchor="middle" font-size="10" fill="#64748b">Corte ${esc(r.corte??'—')}</text></g>`).join('');
 return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución histórica TCH"><rect width="${W}" height="${H}" rx="18" fill="#fff"/><text x="${W/2}" y="20" text-anchor="middle" font-size="15" font-weight="900" fill="#0b3158">Evolución del TCH por zafra</text>${grid}<line x1="${ml}" y1="${H-mb}" x2="${W-mr}" y2="${H-mb}" stroke="#94a3b8"/><line x1="${ml}" y1="${mt}" x2="${ml}" y2="${H-mb}" stroke="#94a3b8"/><path d="${path}" fill="none" stroke="#0b7f3a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>${pts}</svg>`;
}
function render(item, code){
 const out=$('out');
 if(!item){out.innerHTML=`<div class="empty">No encontré producción histórica para CodLote ${esc(code||'—')}.</div>`;return}
 const rows=(item.historial||[]).filter(r=>Number.isFinite(Number(r.tch)));
 const latest=rows[rows.length-1]||{}; const avg=rows.length?rows.reduce((a,r)=>a+Number(r.tch||0),0)/rows.length:null;
 const table=rows.map(r=>`<tr><td>${esc(r.zafra||'—')}</td><td><b>${esc(val(r.tch,' t/ha'))}</b></td><td>${esc(r.corte??'—')}</td><td>${esc(val(r.area_ha,' ha'))}</td><td>${esc(val(r.toneladas,' t'))}</td></tr>`).join('');
 out.innerHTML=`<div class="title"><h2>CODLOTE ${esc(item.codlote||code)}</h2><p>${esc(item.hacienda||'')} ${item.tablon?'· Tablón '+esc(item.tablon):''} ${item.variedad?'· '+esc(item.variedad):''}</p></div><div class="summary"><div><span>Última zafra</span><b>${esc(latest.zafra||'—')}</b></div><div><span>TCH último</span><b>${esc(val(latest.tch,' t/ha'))}</b></div><div><span>Número corte</span><b>${esc(latest.corte??'—')}</b></div><div><span>TCH promedio</span><b>${esc(val(avg,' t/ha'))}</b></div></div><div class="chart">${chart(rows)}</div><div class="table-wrap"><table><thead><tr><th>Zafra</th><th>TCH</th><th>Número de corte</th><th>Área</th><th>Toneladas</th></tr></thead><tbody>${table}</tbody></table></div><div class="note">El gráfico muestra únicamente la evolución del TCH. La tabla incluye el número de corte solicitado.</div>`;
}
async function run(){try{const d=await loadData(); const code=norm($('q').value||paramsCode()); if($('q')&&!$('q').value)$('q').value=code; const lots=d.lotes||{}; render(lots[code]||lots[String(code).replace(/^0+/,'')]||null,code);}catch(e){$('out').innerHTML='<div class="empty">Error cargando producción histórica: '+esc(e.message)+'</div>';}}
$('searchBtn').addEventListener('click',run);$('q').addEventListener('keydown',e=>{if(e.key==='Enter')run()});run();
</script></body></html>
